<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340">
<defs>
  <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#06091A"/><stop offset="100%" style="stop-color:#0B1028"/></linearGradient>
  <linearGradient id="gc" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#22D3EE"/><stop offset="100%" style="stop-color:#3B7BFF"/></linearGradient>
</defs>
<rect width="560" height="340" fill="url(#bg)" rx="18"/>
<!-- Browser window -->
<rect x="28" y="24" width="504" height="294" rx="16" fill="#101530" stroke="rgba(255,255,255,0.09)" stroke-width="1.5"/>
