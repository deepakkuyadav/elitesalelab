<rect x="368" y="192" width="68" height="60" rx="10" fill="rgba(139,92,246,0.1)" stroke="rgba(139,92,246,0.2)" stroke-width="1"/>
<circle cx="402" cy="212" r="8" fill="rgba(139,92,246,0.3)"/>
<text x="402" y="215" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#C4B5FD">ERP</text>
<text x="402" y="242" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#4B5982">Integration</text>
<rect x="446" y="192" width="68" height="60" rx="10" fill="rgba(16,185,129,0.1)" stroke="rgba(16,185,129,0.2)" stroke-width="1"/>
<circle cx="480" cy="212" r="8" fill="rgba(16,185,129,0.3)"/>
<text x="480" y="215" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#34D399">API</text>
<text x="480" y="242" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#4B5982">Backend</text>
