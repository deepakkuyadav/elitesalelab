<rect x="137" y="44" width="8" height="5" rx="1" fill="#10B981" opacity="0.7"/>
<text x="154" y="50" font-family="monospace" font-size="9" fill="#4B5982">https://</text>
<text x="193" y="50" font-family="monospace" font-size="9" fill="#6A9FFF">elitesaleslab.com</text>
