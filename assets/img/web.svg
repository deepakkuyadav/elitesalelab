<path d="M458,40 a8,8 0 1,1 -5,14" fill="none" stroke="#4B5982" stroke-width="1.5" stroke-linecap="round"/>
<polyline points="453,54 453,58 457,54" fill="none" stroke="#4B5982" stroke-width="1.5" stroke-linecap="round"/>
<!-- Split: Code left | Preview right -->
