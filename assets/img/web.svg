  <text x="78" y="108"><tspan fill="#EC4899">&lt;div</tspan><tspan fill="#22D3EE"> class</tspan><tspan fill="#fff">="cn"&gt;</tspan></text>
  <text x="86" y="124"><tspan fill="#EC4899">&lt;h1</tspan><tspan fill="#22D3EE"> class</tspan><tspan fill="#fff">="t1"&gt;</tspan></text>
  <text x="94" y="140" fill="#F59E0B">Build. Scale. Deliver.</text>
  <text x="86" y="156" fill="#EC4899">&lt;/h1&gt;</text>
  <text x="86" y="172"><tspan fill="#EC4899">&lt;p</tspan><tspan fill="#22D3EE"> class</tspan><tspan fill="#fff">="sub"&gt;</tspan></text>
  <text x="94" y="188" fill="#10B981">Enterprise software</text>
  <text x="94" y="204" fill="#10B981">for modern teams.</text>
  <text x="86" y="220" fill="#EC4899">&lt;/p&gt;</text>
  <text x="86" y="236"><tspan fill="#EC4899">&lt;a</tspan><tspan fill="#22D3EE"> href</tspan><tspan fill="#fff">="/contact"</tspan></text>
  <text x="94" y="252"><tspan fill="#22D3EE">class</tspan><tspan fill="#fff">="btn-p"&gt;</tspan></text>
  <text x="94" y="268" fill="#F59E0B">Get Started</text>
  <text x="86" y="284" fill="#EC4899">&lt;/a&gt;</text>
</g>
